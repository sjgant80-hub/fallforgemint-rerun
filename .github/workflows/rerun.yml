name: rerun
# Re-run a FallForge Mint scorecard on a clean GitHub runner. Put your re-run bundle in this repo (the page's
# "Download re-run bundle" button makes one), then Actions → rerun → Run workflow.
# The rail itself lives in sjgant80-hub/fallforgemint: its judgements are in a mutation-gated kernel, and this file
# only calls it. To fix the rail at one version, replace BOTH `@main` and `rail-ref: main` with the same commit SHA.
on:
  workflow_dispatch:
    inputs:
      bundle:
        description: 'path of the re-run bundle in this repo (or an https URL)'
        required: true
        default: bundle.json

permissions:
  contents: read

jobs:
  rerun:
    uses: sjgant80-hub/fallforgemint/.github/workflows/rerun.yml@main
    with:
      bundle: ${{ inputs.bundle }}
      rail-ref: main
